<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="iwonderland - App portfolio">
<meta name="i18n-title" content="home_title">
<title>iwonderland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== iwonderland 官网集合 · 独立视觉 =====
   深空调集合页，与各 App 自身页面配色互不影响 */
:root {
  --bg: #0E0F13;
  --panel: #17181E;
  --panel-2: #1E2028;
  --line: rgba(255,255,255,.08);
  --text: #F0EDE6;
  --dim: #9A968E;
  --accent: #B9A06A;   /* 暖金，集合站专属 */
  --radius: 18px;
  --font-body: 'Inter','Noto Sans SC','Noto Sans JP',system-ui,-apple-system,sans-serif;
  --font-display: 'Space Grotesk','Inter',system-ui,sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); background: var(--bg); color: var(--text); line-height: 1.7; -webkit-font-smoothing: antialiased; }
.container { width: min(1080px, 92%); margin-inline: auto; }
a { color: inherit; }

/* 导航 */
.nav { position: sticky; top: 0; z-index: 20; background: rgba(14,15,19,.78); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.nav-inner { display: flex; align-items: center; gap: 18px; padding: 13px 0; flex-wrap: wrap; }
.nav-brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .2px; text-decoration: none; }
.nav-links { margin-left: auto; }
.nav-links a { color: var(--dim); text-decoration: none; font-size: 14px; }
.nav-links a:hover { color: var(--text); }
.lang-switcher { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
.lang-switcher button { border: 0; background: transparent; color: var(--dim); font-size: 12.5px; padding: 5px 11px; border-radius: 999px; cursor: pointer; font-family: var(--font-body); }
.lang-switcher button.active { background: var(--accent); color: #171309; }

/* Hero */
.hero { text-align: center; padding: 88px 0 64px; }
.hero h1 { font-family: var(--font-display); font-size: clamp(34px, 6vw, 54px); letter-spacing: -.5px; }
.hero .sub { margin-top: 14px; color: var(--dim); font-size: 16px; }

/* 我们的 App */
.section-title { margin-bottom: 30px; }
.section-title h2 { font-family: var(--font-display); font-size: clamp(22px, 3vw, 30px); letter-spacing: -.3px; }
.apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.app-card {
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, var(--panel), var(--panel-2));
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 26px; text-decoration: none;
  transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.app-card:hover { transform: translateY(-4px); border-color: rgba(185,160,106,.45); box-shadow: 0 16px 40px rgba(0,0,0,.35); }
.app-card .app-icon { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.app-card h3 { font-family: var(--font-display); font-size: 20px; letter-spacing: -.2px; }
.app-card p { color: var(--dim); font-size: 14.5px; margin-top: 6px; }
.app-card .arrow { margin-top: auto; padding-top: 16px; color: var(--accent); font-weight: 700; }

/* 页脚 */
.footer { border-top: 1px solid var(--line); margin-top: 72px; padding: 28px 0; }
.footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.footer-copy { color: var(--dim); font-size: 13px; }

@media (max-width: 720px) {
  .features { padding: 40px 0; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a href="index.html" class="nav-brand">iwonderland</a>
    <div class="nav-links">
      <a href="https://github.com/iwonderland" target="_blank" data-i18n="nav_github">GitHub</a>
    </div>
    <div class="lang-switcher" aria-label="Language">
      <button data-lang-btn="zh">中文</button>
      <button data-lang-btn="ja">日本語</button>
      <button data-lang-btn="en">EN</button>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <h1>iwonderland</h1>
    <p class="sub">Handcrafted apps for everyday life.</p>
  </div>
</header>

<section class="features">
  <div class="container">
    <div class="section-title">
      <h2 data-i18n="home_apps">我们的 App</h2>
    </div>
    <div class="apps-grid">
      <a href="floatprompt/index.html" class="app-card">
        <img src="assets/img/logo.png" alt="FloatPrompt" class="app-icon">
        <h3>FloatPrompt</h3>
        <p data-i18n="home_card_desc">AI 语音跟随提词器，全屏与悬浮双模式。</p>
        <span class="arrow">→</span>
      </a>
      <a href="subfolks/index.html" class="app-card">
        <img src="assets/img/subfolks_logo.png" alt="Subfolks" class="app-icon">
        <h3>Subfolks</h3>
        <p data-i18n="sub_card_desc">全家订阅账单，一处管好。扣费前提醒，不再多花钱。</p>
        <span class="arrow">→</span>
      </a>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container footer-inner">
    <div>© 2026 iwonderland</div>
    <a href="https://github.com/iwonderland" target="_blank" style="color:var(--dim);text-decoration:none;font-size:13px" data-i18n="nav_github">GitHub</a>
  </div>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
